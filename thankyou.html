<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thank You | Greenfiled Lavender</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;

        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55));

        background-size: cover;
        background-position: center;

        overflow: hidden;
      }

      .thankyou-card {
        width: 90%;
        max-width: 650px;

        background: rgba(255, 255, 255, 0.1);

        backdrop-filter: blur(15px);

        border: 1px solid rgba(255, 255, 255, 0.15);

        border-radius: 30px;

        padding: 70px 50px;

        text-align: center;

        color: #fff;

        animation: fadeUp 1s ease;
      }

      .icon {
        width: 110px;
        height: 110px;

        margin: 0 auto 30px;

        border-radius: 50%;

        background: #7c4996;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 50px;

        color: #fff;

        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      }

      h1 {
        font-size: 45px;
        font-weight: 600;

        margin-bottom: 20px;
      }

      p {
        font-size: 16px;

        line-height: 1.8;

        color: rgba(255, 255, 255, 0.85);

        margin-bottom: 35px;
      }

      .btn {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        width: 220px;
        height: 58px;

        border-radius: 60px;

        background: #7c4996;

        color: #fff;

        text-decoration: none;

        font-size: 15px;
        letter-spacing: 1px;

        transition: 0.4s ease;
      }

      .btn:hover {
        transform: translateY(-3px);

        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        .thankyou-card {
          padding: 50px 25px;
        }

        h1 {
          font-size: 38px;
        }

        p {
          font-size: 16px;
        }

        .icon {
          width: 90px;
          height: 90px;
          font-size: 40px;
        }
      }
    </style>
  </head>

  <body>
    <div class="thankyou-card">
      <div class="icon">✓</div>

      <h1>Thank You</h1>

      <p>
        Your enquiry has been submitted successfully. Our team will contact you
        shortly and assist you with complete project details.
      </p>

      <a href="/" class="btn"> Back To Home </a>

      <!-- after 5 second redirect to home -->
      <script>
        setTimeout(() => {
          window.location.href = "/";
        }, 5000);
      </script>
    </div>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=AW-17576117111"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "AW-17576117111");
    </script>
    <!-- Event snippet for Submit lead form conversion page -->
    <script>
      gtag("event", "conversion", {
        send_to: "AW-17576117111/DH7VCL2Y0JwbEPeG-bxB",
        value: 1.0,
        currency: "INR",
      });
    </script>
  </body>
</html>
